<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마켓컬리 - 회원가입</title>
    <style>
        *{
            /* margin: 0;
            padding: 0; */
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
        }
        h1 img{
            vertical-align: middle;
        }
        h1 span{
            font-size: 18px;
            font-weight: normal;
            color: #5f0080;
        }
        b{
            font-weight: normal;
            color: red;
        }
        ul{
            padding: 0;
        }
        li{
            list-style: none;
            padding: 10px 20px;
            /* overflow: hidden; */
        }
        input{
            width: 300px;
            height: 40px;
            border: 1px solid #ddd;
            outline: none;
            border-radius: 4px;
            padding-left: 15px;
        }
        input::placeholder{
            font-size: 14px;
        }
        input.short{
            width: 150px;
        }
        input[type="button"]{
            width: 100px;
            padding-left: 0;
        }
        input[type="button"]:hover{
            background-color: #5f0080;
            color: #fff;
            border: none;
        }
        input[type="radio"], input[type="checkbox"]{
            width: 15px;
            height: 15px;
        }
        input[type="range"]{
            vertical-align: middle;
        }


        select{
            width: 150px;
            height: 40px;
            border: 1px solid #ddd;
            outline: none;
            border-radius: 4px;
            padding-left: 15px;
            color: #757575;
        }
        button{
            padding: 10px 40px;
            margin-top: 20px;
            background-color: #5f0080;
            color: #fff;
            border: none;
            border-radius: 4px;
        }
        button:hover{
            background-color: #fff;
            color: #5f0080;
            border: 1px solid #5f0080;
        }
        
        #txt{
            margin: 0 auto;
            margin-bottom: 10px;
            width: 640px;
            text-align: right;
            font-size: 14px;
            color: #ccc;
        }

        #container{
            width: 640px;
            margin: auto;
            /* border-top: 2px solid #333;*/
        }
        #container span{
            display: inline-block;
            width: 139px;
        }

        #wrap{
            text-align: center;
        }

        /* #test span{
            float: left;
        }
        #test label{
            float: right;
        } */
        
    </style>
</head>
<body>
    <h1>
        <img src="마켓컬리.svg" alt="마켓컬리"><span>마켓컬리</span>
    </h1>
    <p id="txt"><b>*</b>필수입력사항</p>
    <div id="container">
        <form action="" method="post">
            <fieldset>
                <legend>로그인 정보</legend>
                <ul>
                    <li>
                        <span>아이디<b>*</b></span>
                        <input type="text" placeholder="아이디를 입력해주세요." maxlength="10" required>
                    </li>
                    <li>
                        <span>비밀번호<b>*</b></span>
                        <input type="password" placeholder="비밀번호를 입력해주세요." maxlength="12" required>
                    </li>
                    <li>
                        <span>비밀번호확인<b>*</b></span>
                        <input type="password" placeholder="비밀번호를 한번 더 입력해주세요." required>
                    </li>
                </ul>
            </fieldset>

            <fieldset>
                <legend>가입자 정보</legend>
                <ul>
                    <li>
                        <span>이름<b>*</b></span>
                        <input type="text" placeholder="이름을 입력해주세요." maxlength="5" required>
                    </li>
                    <li>
                        <span>이메일1<b>*</b></span>
                        <input type="email" placeholder="이메일을 직접 입력해주세요.">
                    </li>
                    <li>
                        <span>이메일2<b>*</b></span>
                        <input type="text" class="short" placeholder="예: marketkurly" style="margin-right: 10px;"> @
                        <select name="mail" id="email_select">
                            <option>---- 선택하기 ----</option>
                            <option value="naver">naver.com</option>
                            <option value="gmail">gmail.com</option>
                            <option value="hanmail">hanmail.com</option>
                            <option value="kakao">kakao.com</option>
                            <option value="etc">직접입력</option>
                        </select>
                    </li>
                    <li>
                        <span>전화번호<b>*</b></span>
                        <input type="tel" maxlength="12" value="010" placeholder="전화번호를 입력해주세요."  style="color: #757575;" required>
                    </li>
                    <li>
                        <span>휴대폰<b>*</b></span>
                        <input type="number" maxlength="12" placeholder="숫자만 입력해주세요." required>
                        <input type="button" value="인증번호 받기">
                    </li>
                    <li>
                        <span>생년월일<b>*</b></span>
                        <input type="date" placeholder="생년월일을 입력해주세요." style="color: #757575;">
                    </li>
                    <li>
                        <span>홈페이지 주소</span>
                        <input type="url" value="http://" placeholder="url을 입력해주세요." style="color: #757575;">
                    </li>
                    <li>
                        <span>우편번호<b>*</b></span>
                        <input type="search" placeholder="지번/도로명을 입력해주세요">
                        <input type="button" value="찾기">
                    </li>
                    <!-- <li>
                        <span>성별</span>
                        <label><input type="radio" name="gender"> 남자</label>
                        <label><input type="radio" name="gender"> 여자</label>
                        <label><input type="radio" name="gender"> 비이진</label>
                        <label><input type="radio" name="gender"> 선택 안 함</label>
                    </li> -->
                    <li>
                        <span>성별<b>*</b></span>
                        <input type="radio" name="gender" id="male">
                        <input type="radio" name="gender" id="female">
                        <input type="radio" name="gender" id="non-binary">
                        <input type="radio" name="gender" id="none">
                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                        <label for="male">남자</label> /
                        <label for="female">여자</label> /
                        <label for="non-binary">비이진</label> /
                        <label for="none">선택 안 함</label>
                    </li>
                    <li>
                        <div id="test">
                            <span>관심분야<b>*</b></span>
                            <label><input type="checkbox">주식</label>
                            <label><input type="checkbox">부동산</label>
                            <label><input type="checkbox">스포츠</label>
                            <label><input type="checkbox">영화</label>
                            <label><input type="checkbox">음악</label>
                            <label><input type="checkbox">공연</label>
                            <label><input type="checkbox">건강</label>
                        </div>
                    </li>
                    <li>
                        <span>나이대</span>
                        <input type="range" min="10" max="60" step="10" id="age" value="10">
                        <output for="age"></output>
                    </li>
                    <li oninput="result.value=parseInt(age.value)">
                        <span>나이대</span>
                        <input type="range" min="10" max="60" step="10" id="age" name="slider" value="10" />
                        <output name="result" for="age">10</output>
                    </li>
                    <li>
                        <span>사진 업로드</span>
                        <input type="file" style="border: none;">
                    </li>
                    <li>
                        <span style="vertical-align: top;">가입동기</span>
                        <textarea rows="5" cols="50" style="resize: none;">가입동기를 자세하게 서술해주세요</textarea>
                    </li>
                </ul>
            </fieldset>

            <div id="wrap">
                <button type="submit">확인</button>
                <button type="reset">취소</button>
            </div>
        </form>
    </div>

</body>
</html>
